# Register the archived-session cleanup page.
#
# This plugin adds one Settings page ("已归档会话") served by this plugin's own
# host half. The host half owns the only destructive write in the plugin: it
# removes a session's durable log directory and drops the id from the
# Workspace archive set, in that order, so a failure never leaves an
# archive-set entry pointing at a session whose log is already gone.

- insert:
    - id: session-cleanup
      name: dsh-session-cleanup
